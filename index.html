<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motion Canvas Explainer Studio 9:16</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #05060a; color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex; gap: 28px; justify-content: center; align-items: center;
      min-height: 100vh; padding: 20px;
    }
    #panel-input {
      width: 350px; background: #0f1420; border: 1px solid #1e293b;
      border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7);
    }
    #panel-input h3 { font-size: 13px; color: #38bdf8; text-transform: uppercase; letter-spacing: 1.5px; }
    textarea {
      width: 100%; height: 420px; background: #060911; color: #4ade80;
      border: 1px solid #1e293b; border-radius: 10px; padding: 12px;
      font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.45;
      resize: none; outline: none;
    }
    .btn-apply {
      background: linear-gradient(135deg, #0ea5e9, #6366f1); color: #fff;
      border: none; padding: 13px; border-radius: 10px; font-weight: 800;
      font-size: 13px; cursor: pointer;
    }
    .btn-apply:hover { filter: brightness(1.15); }

    #viewport {
      width: 360px; height: 640px; border-radius: 26px; position: relative;
      overflow: hidden; background: #070a12;
      box-shadow: 0 30px 80px rgba(0,0,0,0.95), 0 0 0 2px rgba(255,255,255,0.08);
      transition: background 0.6s ease;
    }
    #camera {
      width: 100%; height: 100%; position: absolute; inset: 0;
      transform-origin: center center; will-change: transform;
    }
    .vector-grid {
      position: absolute; inset: -80px;
      background-image: linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 36px 36px; animation: gridMove 6s linear infinite; pointer-events: none;
    }
    @keyframes gridMove { 0% { transform: translate(0,0); } 100% { transform: translate(-36px,-36px); } }

    .ambient-glow {
      position: absolute; width: 280px; height: 280px; border-radius: 50%;
      filter: blur(65px); opacity: 0.45; top: 16%; left: 10%; pointer-events: none;
      transition: background 0.5s ease; animation: pulseGlow 3s ease-in-out infinite alternate;
    }
    @keyframes pulseGlow { 0% { transform: scale(0.9); } 100% { transform: scale(1.15); } }

    .hud-top {
      position: absolute; top: 20px; left: 22px; right: 22px;
      display: flex; justify-content: space-between; align-items: center; z-index: 20;
      font-family: 'JetBrains Mono', monospace; font-size: 10px; color: rgba(255,255,255,0.55); letter-spacing: 2px;
    }
    .rec-dot {
      display: inline-block; width: 7px; height: 7px; background: #ef4444;
      border-radius: 50%; margin-right: 6px; box-shadow: 0 0 8px #ef4444;
      animation: blink 0.8s infinite alternate;
    }
    @keyframes blink { 0% { opacity: 1; } 100% { opacity: 0.25; } }

    #stage {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      justify-content: center; align-items: center; padding: 30px 22px; z-index: 10; text-align: center;
    }
    .mc-tag {
      font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 800;
      letter-spacing: 3px; text-transform: uppercase; padding: 6px 16px; border-radius: 6px;
      background: rgba(255,255,255,0.08); border-left: 3px solid #38bdf8;
      margin-bottom: 20px; backdrop-filter: blur(6px); opacity: 0;
    }
    .mc-graphic-box {
      position: relative; width: 200px; height: 200px; display: flex;
      justify-content: center; align-items: center; margin-bottom: 20px;
    }
    .mc-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .svg-spin { transform-origin: 100px 100px; animation: spin 12s linear infinite; }
    .svg-spin-rev { transform-origin: 100px 100px; animation: spinRev 9s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes spinRev { 100% { transform: rotate(-360deg); } }

    .mc-center-val { position: relative; z-index: 5; display: flex; flex-direction: column; align-items: center; }
    .mc-icon { font-size: 58px; filter: drop-shadow(0 12px 24px rgba(0,0,0,0.6)); line-height: 1; opacity: 0; }
    .mc-stat { font-family: 'JetBrains Mono', monospace; font-size: 24px; font-weight: 800; margin-top: 6px; letter-spacing: -1px; }

    .mc-title-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 8px; margin-bottom: 16px; }
    .word-mask { overflow: hidden; display: inline-block; padding: 2px 0; }
    .word-inner { display: inline-block; font-size: 27px; font-weight: 900; line-height: 1.12; text-transform: uppercase; opacity: 0; }

    .mc-sub-box {
      background: rgba(15, 23, 42, 0.75); border: 1px solid rgba(255,255,255,0.14);
      border-radius: 14px; padding: 13px 16px; backdrop-filter: blur(10px); max-width: 310px; opacity: 0;
    }
    .mc-sub-text { font-size: 14px; font-weight: 600; line-height: 1.45; color: rgba(255,255,255,0.92); }

    .hud-bottom {
      position: absolute; bottom: 18px; left: 22px; right: 22px;
      display: flex; justify-content: space-between; align-items: flex-end; z-index: 20;
    }
    .bars { display: flex; gap: 3px; align-items: flex-end; height: 16px; }
    .bar { width: 3px; background: #38bdf8; border-radius: 2px; animation: eq 0.4s ease-in-out infinite alternate; }
    .bar:nth-child(2) { animation-delay: 0.1s; } .bar:nth-child(3) { animation-delay: 0.25s; }
    .bar:nth-child(4) { animation-delay: 0.15s; } .bar:nth-child(5) { animation-delay: 0.3s; }
    @keyframes eq { 0% { height: 4px; } 100% { height: 16px; } }
    .scene-counter { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: rgba(255,255,255,0.5); }
    #progress-line { position: absolute; bottom: 0; left: 0; height: 5px; background: #38bdf8; width: 0%; z-index: 30; }
  </style>
</head>
<body>

  <div id="panel-input">
    <h3>🎬 Motion Canvas JSON Studio</h3>
    <textarea id="json-input"></textarea>
    <button class="btn-apply" onclick="applyAndPlay()">▶️ Terapkan & Putar Animasi</button>
  </div>

  <div id="viewport">
    <div class="hud-top">
      <div><span class="rec-dot"></span>SIMULATION // 60FPS</div>
      <div id="hud-timer">00:00.0</div>
    </div>
    <div id="camera">
      <div class="vector-grid"></div>
      <div class="ambient-glow" id="bg-glow"></div>
      <div id="stage"></div>
    </div>
    <div class="hud-bottom">
      <div class="bars"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
      <div class="scene-counter" id="scene-idx">SCENE 01/06</div>
    </div>
    <div id="progress-line"></div>
  </div>

  <script>
    window.DATA_VIDEO = [
      { durasi: 3.5, warnaAksen: "#38bdf8", bg: "radial-gradient(circle at 50% 30%, #0f172a, #020617)", kategori: "SIMULASI SAINS", ikon: "🌍", angkaTarget: 5, satuan: " DETIK", teksUtama: "BUMI TANPA OKSIGEN?", subTeks: "Bukan cuma soal napas, struktur bumi akan hancur seketika!", efekKamera: "zoomIn" },
      { durasi: 4.5, warnaAksen: "#facc15", bg: "radial-gradient(circle at 50% 30%, #450a0a, #090202)", kategori: "DETIK KE-1 // STRUKTUR", ikon: "🏢", angkaTarget: 100, satuan: "% RUNTUH", teksUtama: "GEDUNG BETON MENJADI DEBU", subTeks: "Oksigen adalah pengikat utama molekul beton di seluruh dunia.", efekKamera: "shake" },
      { durasi: 5.0, warnaAksen: "#a855f7", bg: "radial-gradient(circle at 50% 30%, #1e1b4b, #030108)", kategori: "DETIK KE-2 // ATMOSFER", ikon: "🌌", angkaTarget: 0, satuan: " CAHAYA", teksUtama: "LANGIT SIANG GELAP GULITA", subTeks: "Partikel udara berkurang 21%, cahaya matahari gagal dipantulkan.", efekKamera: "panRight" },
      { durasi: 4.5, warnaAksen: "#f43f5e", bg: "radial-gradient(circle at 50% 30%, #3b0764, #090314)", kategori: "DETIK KE-3 // MESIN", ikon: "✈️", angkaTarget: 0, satuan: " PEMBAKARAN", teksUtama: "KENDARAAN & PESAWAT MATI", subTeks: "Tanpa oksigen, tidak ada api di mesin pembakaran internal.", efekKamera: "zoomOut" },
      { durasi: 4.5, warnaAksen: "#fb923c", bg: "radial-gradient(circle at 50% 30%, #7c2d12, #0c0401)", kategori: "DETIK KE-4 // RADIASI", ikon: "☀️", angkaTarget: 300, satuan: "% UV EKSTREM", teksUtama: "LAPISAN OZON LENYAP", subTeks: "Ozon terbuat dari 3 atom oksigen. Kulit langsung terbakar!", efekKamera: "shake" },
      { durasi: 4.0, warnaAksen: "#2dd4bf", bg: "radial-gradient(circle at 50% 30%, #064e3b, #02120e)", kategori: "KESIMPULAN AKHIR", ikon: "🧬", angkaTarget: 21, satuan: "% OKSIGEN", teksUtama: "BISAKAH KITA SELAMAT?", subTeks: "Tulis pendapatmu di kolom komentar di bawah!", efekKamera: "zoomIn" }
    ];

    const inputEl = document.getElementById('json-input');
    inputEl.value = JSON.stringify(window.DATA_VIDEO, null, 2);

    let currentIdx = 0, sceneTimer = null, exitTimer = null, rafId = null;
    let startTime = performance.now();

    setInterval(() => {
      const s = ((performance.now() - startTime) / 1000).toFixed(1);
      document.getElementById('hud-timer').innerText = "00:" + s.padStart(4, '0');
    }, 100);

    function playScene(index) {
      const scenes = window.DATA_VIDEO || [];
      if (!scenes.length) return;
      clearTimeout(sceneTimer); clearTimeout(exitTimer); cancelAnimationFrame(rafId);

      const s = scenes[index];
      const durasiMs = (s.durasi || 4) * 1000;
      const aksen = s.warnaAksen || "#38bdf8";

      document.getElementById('viewport').style.background = s.bg || "#070a12";
      document.getElementById('bg-glow').style.background = aksen;
      document.getElementById('progress-line').style.background = aksen;
      document.getElementById('scene-idx').innerText = `SCENE 0${index + 1}/0${scenes.length}`;

      const words = (s.teksUtama || "").split(" ").filter(Boolean);
      const wordsHtml = words.map((w, i) => {
        const col = (i === words.length - 1) ? aksen : "#ffffff";
        return `<span class="word-mask"><span class="word-inner" style="color:${col}">${w}</span></span>`;
      }).join("");

      const stage = document.getElementById('stage');
      stage.innerHTML = `
        <div class="mc-tag" id="el-tag" style="border-left-color:${aksen}; color:${aksen}">${s.kategori || 'INFO'}</div>
        <div class="mc-graphic-box">
          <svg class="mc-svg" viewBox="0 0 200 200">
            <circle class="svg-spin" cx="100" cy="100" r="92" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1.5" stroke-dasharray="8 6" />
            <circle id="ring-draw" cx="100" cy="100" r="76" fill="none" stroke="${aksen}" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="480" stroke-dashoffset="480" transform="rotate(-90 100 100)" />
            <polygon class="svg-spin-rev" points="100,26 164,63 164,137 100,174 36,137 36,63" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.2" />
          </svg>
          <div class="mc-center-val">
            <div class="mc-icon" id="el-icon">${s.ikon || '⚡'}</div>
            ${s.angkaTarget !== undefined ? `<div class="mc-stat" style="color:${aksen}"><span id="num-val">0</span>${s.satuan || ''}</div>` : ''}
          </div>
        </div>
        <div class="mc-title-container">${wordsHtml}</div>
        <div class="mc-sub-box" id="el-sub"><div class="mc-sub-text">${s.subTeks || ''}</div></div>
      `;

      // Kamera Virtual
      const cam = document.getElementById('camera');
      if (s.efekKamera === "shake") {
        cam.animate([
          { transform: 'translate(0,0) scale(1)' },
          { transform: 'translate(-6px, 5px) scale(1.03)', offset: 0.1 },
          { transform: 'translate(6px, -5px) scale(1.04)', offset: 0.2 },
          { transform: 'translate(-4px, -4px) scale(1.04)', offset: 0.3 },
          { transform: 'translate(4px, 4px) scale(1.05)', offset: 0.4 },
          { transform: 'translate(0,0) scale(1.06)' }
        ], { duration: durasiMs, easing: 'ease-out', fill: 'forwards' });
      } else if (s.efekKamera === "panRight") {
        cam.animate([{ transform: 'translateX(-16px) scale(1.04)' }, { transform: 'translateX(16px) scale(1.04)' }], { duration: durasiMs, fill: 'forwards' });
      } else if (s.efekKamera === "zoomOut") {
        cam.animate([{ transform: 'scale(1.12)' }, { transform: 'scale(0.96)' }], { duration: durasiMs, fill: 'forwards' });
      } else {
        cam.animate([{ transform: 'scale(0.92)' }, { transform: 'scale(1.08)' }], { duration: durasiMs, fill: 'forwards' });
      }

      // Animasi Elemen (Spring Curves)
      document.getElementById('el-tag').animate([
        { opacity: 0, transform: 'translateY(-25px) scale(0.8)' },
        { opacity: 1, transform: 'translateY(0) scale(1)' }
      ], { duration: 500, easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)', fill: 'forwards' });

      document.getElementById('ring-draw').animate([
        { strokeDashoffset: 480 }, { strokeDashoffset: 75 }
      ], { duration: 1100, delay: 100, easing: 'cubic-bezier(0.16, 1, 0.3, 1)', fill: 'forwards' });

      const iconEl = document.getElementById('el-icon');
      iconEl.animate([
        { opacity: 0, transform: 'scale(0.1) rotate(-30deg)' },
        { opacity: 1, transform: 'scale(1.18) rotate(6deg)', offset: 0.65 },
        { opacity: 1, transform: 'scale(1) rotate(0deg)' }
      ], { duration: 750, delay: 120, easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)', fill: 'forwards' });

      // Counter Angka 60FPS
      if (s.angkaTarget !== undefined) {
        const numEl = document.getElementById('num-val');
        const t0 = performance.now();
        function tick(now) {
          const p = Math.min(1, (now - t0) / 1000);
          const ease = 1 - Math.pow(1 - p, 3);
          if (numEl) numEl.innerText = Math.round(s.angkaTarget * ease);
          if (p < 1) rafId = requestAnimationFrame(tick);
        }
        rafId = requestAnimationFrame(tick);
      }

      // Masking Kata per Kata
      stage.querySelectorAll('.word-inner').forEach((el, i) => {
        el.animate([
          { opacity: 0, transform: 'translateY(115%) rotateZ(6deg)' },
          { opacity: 1, transform: 'translateY(0%) rotateZ(0deg)' }
        ], { duration: 550, delay: 200 + (i * 75), easing: 'cubic-bezier(0.16, 1, 0.3, 1)', fill: 'forwards' });
      });

      document.getElementById('el-sub').animate([
        { opacity: 0, transform: 'translateY(25px) scale(0.92)' },
        { opacity: 1, transform: 'translateY(0) scale(1)' }
      ], { duration: 550, delay: 480, easing: 'cubic-bezier(0.16, 1, 0.3, 1)', fill: 'forwards' });

      document.getElementById('progress-line').animate([{ width: '0%' }, { width: '100%' }], { duration: durasiMs, fill: 'forwards' });

      // Exit Transition
      if (durasiMs > 900) {
        exitTimer = setTimeout(() => {
          stage.animate([
            { opacity: 1, transform: 'scale(1) translateY(0)', filter: 'blur(0px)' },
            { opacity: 0, transform: 'scale(0.9) translateY(-25px)', filter: 'blur(8px)' }
          ], { duration: 380, easing: ' ease-in', fill: 'forwards' });
        }, durasiMs - 380);
      }

      sceneTimer = setTimeout(() => {
        currentIdx = (currentIdx + 1) % scenes.length;
        playScene(currentIdx);
      }, durasiMs);
    }

    function applyAndPlay() {
      try {
        window.DATA_VIDEO = eval('(' + inputEl.value + ')');
        currentIdx = 0; startTime = performance.now();
        playScene(0);
      } catch (e) {
        alert("Format JSON kurang tepat, periksa tanda kurung dan koma!");
      }
    }

    playScene(0);
  </script>
</body>
</html>
