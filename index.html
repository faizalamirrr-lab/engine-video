<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio Preview Video Kompleks 9:16</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="panel-input">
    <h3>📋 Array Adegan Kompleks:</h3>
    <textarea id="json-input"></textarea>
    <button class="btn-apply" onclick="updateVideo()">▶️ Terapkan & Putar Video</button>
  </div>

  <div class="player-area">
    <div id="canvas-9-16"></div>
  </div>

  <script>
    window.DATA_VIDEO = [
      { durasi: 3.0, bg: "linear-gradient(135deg, #0f172a, #1e3a8a)", warnaJudul: "#38bdf8", warnaTeks: "#ffffff", kategori: "WHAT IF SAINS", ikon: "🌍", teksUtama: "BUMI TANPA OKSIGEN 5 DETIK?", subTeks: "Bukan cuma soal napas, ini yang hancur seketika!" }
    ];

    document.getElementById('json-input').value = JSON.stringify(window.DATA_VIDEO, null, 2);

    function updateVideo() {
      try {
        const raw = document.getElementById('json-input').value;
        window.DATA_VIDEO = eval('(' + raw + ')');
        currentScene = 0;
        renderScene(0);
      } catch (e) {
        alert("Format JSON keliru, pastikan tanda kurung siku dan komanya benar!");
      }
    }
  </script>
  <script src="engine.js"></script>
</body>
</html>
